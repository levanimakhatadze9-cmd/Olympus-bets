<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympus Bets | ტოპ კოეფიციენტები & ბილეთები</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans">

    <!-- Header -->
    <header class="border-b border-amber-500/20 bg-gray-900/80 px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-extrabold tracking-wider text-amber-400">OLYMPUS<span class="text-white">BETS</span></h1>
        <button class="bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold px-4 py-2 rounded-lg transition">
            ავტორიზაცია
        </button>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Matches & High Odds Section -->
        <section class="lg:col-span-2 space-y-4">
            <h2 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                🔥 დღის კაი კუშები (Value Bets)
            </h2>

            <!-- Match Card Example -->
            <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <span class="text-xs text-amber-400/80 font-semibold uppercase">ჩემპიონთა ლიგა</span>
                    <p class="font-bold text-lg">რეალი vs მანჩესტერ სიტი</p>
                    <p class="text-xs text-gray-400">დღეს, 22:00</p>
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <button class="flex-1 md:flex-none bg-gray-800 hover:bg-amber-500 hover:text-gray-950 p-2 rounded-lg text-center transition">
                        <span class="block text-xs text-gray-400">1</span>
                        <span class="font-bold">2.45</span>
                    </button>
                    <button class="flex-1 md:flex-none bg-gray-800 hover:bg-amber-500 hover:text-gray-950 p-2 rounded-lg text-center transition">
                        <span class="block text-xs text-gray-400">X</span>
                        <span class="font-bold">3.60</span>
                    </button>
                    <button class="flex-1 md:flex-none bg-gray-800 hover:bg-amber-500 hover:text-gray-950 p-2 rounded-lg text-center transition">
                        <span class="block text-xs text-gray-400">2</span>
                        <span class="font-bold">2.80</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Ticket Generator Widget -->
        <aside class="bg-gray-900 border border-amber-500/30 p-5 rounded-xl h-fit space-y-4">
            <h3 class="text-lg font-bold text-amber-400">⚡ ბილეთის გენერატორი</h3>
            <div>
                <label class="text-xs text-gray-400 block mb-1">სასურველი ჯამური კოეფიციენტი</label>
                <input type="number" value="5.0" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white outline-none focus:border-amber-400">
            </div>
            <div>
                <label class="text-xs text-gray-400 block mb-1">რისკის დონე</label>
                <select class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white outline-none focus:border-amber-400">
                    <option>დაბალი (სტაბილური)</option>
                    <option selected>საშუალო (ოპტიმალური)</option>
                    <option>მაღალი (კაი კუშები)</option>
                </select>
            </div>
            <button class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-gray-950 font-bold py-3 rounded-lg shadow-lg transition">
                ბილეთის აწყობა
            </button>
        </aside>

    </main>
</body>
</html>
