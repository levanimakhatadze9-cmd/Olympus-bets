<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympus Bets | ტოპ კოეფიციენტები & ბილეთები</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans pb-10">

    <!-- Header -->
    <header class="border-b border-amber-500/20 bg-gray-900/80 px-6 py-4 flex justify-between items-center sticky top-0 z-50 backdrop-blur-md">
        <h1 class="text-2xl font-extrabold tracking-wider text-amber-400">OLYMPUS<span class="text-white">BETS</span></h1>
        <button class="bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold px-4 py-2 rounded-lg transition">
            ავტორიზაცია
        </button>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Ticket Generator Widget -->
        <aside class="bg-gray-900 border border-amber-500/30 p-5 rounded-xl h-fit space-y-4">
            <h3 class="text-lg font-bold text-amber-400 flex items-center gap-2">
                ⚡ ბილეთის გენერატორი
            </h3>
            <div>
                <label class="text-xs text-gray-400 block mb-1">სასურველი ჯამური კოეფიციენტი</label>
                <input id="targetOdds" type="number" value="12" class="w-full bg-gray-800 border border-gray-700 rounded p-2.5 text-white outline-none focus:border-amber-400 font-bold">
            </div>
            <div>
                <label class="text-xs text-gray-400 block mb-1">რისკის დონე</label>
                <select id="riskLevel" class="w-full bg-gray-800 border border-gray-700 rounded p-2.5 text-white outline-none focus:border-amber-400">
                    <option value="low">დაბალი (სტაბილური)</option>
                    <option value="medium" selected>საშუალო (ოპტიმალური)</option>
                    <option value="high">მაღალი (კაი კუშები)</option>
                </select>
            </div>
            <button onclick="generateTicket()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-gray-950 font-bold py-3 rounded-lg shadow-lg transition transform active:scale-95">
                ბილეთის აწყობა
            </button>

            <!-- Generated Ticket Output -->
            <div id="ticketResult" class="hidden border-t border-gray-800 pt-4 space-y-3">
                <div class="flex justify-between items-center bg-amber-500/10 p-2.5 rounded-lg border border-amber-500/20">
                    <span class="text-xs text-amber-400 font-bold">ჯამური კოეფიციენტი:</span>
                    <span id="totalOdds" class="text-lg font-extrabold text-amber-400">0.00</span>
                </div>
                <div id="ticketMatches" class="space-y-2 text-sm"></div>
            </div>
        </aside>

        <!-- Matches & High Odds Section -->
        <section class="lg:col-span-2 space-y-4">
            <h2 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                🔥 დღის კაი კუშები (Value Bets)
            </h2>

            <!-- Match Card 1 -->
            <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <span class="text-xs text-amber-400/80 font-semibold uppercase">ჩემპიონთა ლიგა</span>
                    <p class="font-bold text-lg">რეალი vs მანჩესტერ სიტი</p>
                    <p class="text-xs text-gray-400">დღეს, 22:00</p>
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <button class="flex-1 md:flex-none bg-gray-800 hover:bg-amber-500 hover:text-gray-950 px-4 py-2 rounded-lg transition">
                        <span class="block text-xs text-gray-400">1</span>
                        <span class="font-bold">2.45</span>
                    </button>
                    <button class="flex-1 md:flex-none bg-gray-800 hover:bg-amber-500 hover:text-gray-950 px-4 py-2 rounded-lg transition">
                        <span class="block text-xs text-gray-400">X</span>
                        <span class="font-bold">3.60</span>
                    </button>
                    <button class="flex-1 md:flex-none bg-gray-800 hover:bg-amber-500 hover:text-gray-950 px-4 py-2 rounded-lg transition">
                        <span class="block text-xs text-gray-400">2</span>
                        <span class="font-bold">2.80</span>
                    </button>
                </div>
            </div>

            <!-- Match Card 2 -->
            <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <span class="text-xs text-amber-400/80 font-semibold uppercase">სერია A</span>
                    <p class="font-bold text-lg">ინტერი vs იუვენტუსი</p>
                    <p class="text-xs text-gray-400">ხვალ, 21:45</p>
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <button class="flex-1 md:flex-none bg-gray-800 hover:bg-amber-500 hover:text-gray-950 px-4 py-2 rounded-lg transition">
                        <span class="block text-xs text-gray-400">1</span>
                        <span class="font-bold">1.95</span>
                    </button>
                    <button class="flex-1 md:flex-none bg-gray-800 hover:bg-amber-500 hover:text-gray-950 px-4 py-2 rounded-lg transition">
                        <span class="block text-xs text-gray-400">X</span>
                        <span class="font-bold">3.30</span>
                    </button>
                    <button class="flex-1 md:flex-none bg-gray-800 hover:bg-amber-500 hover:text-gray-950 px-4 py-2 rounded-lg transition">
                        <span class="block text-xs text-gray-400">2</span>
                        <span class="font-bold">4.10</span>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        const sampleMatches = [
            { match: "რეალი vs სიტი", pick: "ორივე გაიტანს (BTTS)", odds: 1.65 },
            { match: "ინტერი vs იუვენტუსი", pick: "1 (ინტერის მოგება)", odds: 1.95 },
            { match: "ბარსელონა vs ატლეტიკო", pick: "2.5-ზე მეტი გოლი", odds: 1.75 },
            { match: "ბაიერნი vs დორტმუნდი", pick: "1 & 2.5-ზე მეტი", odds: 2.10 },
            { match: "არსენალი vs ჩელსი", pick: "1 (არსენალის მოგება)", odds: 1.80 }
        ];

        function generateTicket() {
            const resultDiv = document.getElementById("ticketResult");
            const matchesDiv = document.getElementById("ticketMatches");
            const totalOddsSpan = document.getElementById("totalOdds");
            
            matchesDiv.innerHTML = "";
            let currentOdds = 1.0;
            let selected = [];

            // Pick 3 random picks for dynamic combo
            const shuffled = [...sampleMatches].sort(() => 0.5 - Math.random());
            selected = shuffled.slice(0, 3);

            selected.forEach(item => {
                currentOdds *= item.odds;
                matchesDiv.innerHTML += `
                    <div class="bg-gray-800/60 p-2.5 rounded border border-gray-700/50">
                        <div class="font-bold text-gray-200 text-xs">${item.match}</div>
                        <div class="flex justify-between text-xs text-amber-400 mt-1">
                            <span>${item.pick}</span>
                            <span class="font-bold">${item.odds}</span>
                        </div>
                    </div>
                `;
            });

            totalOddsSpan.innerText = currentOdds.toFixed(2);
            resultDiv.classList.remove("hidden");
        }
    </script>
</body>
</html>
