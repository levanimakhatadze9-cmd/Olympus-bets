<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympus Bets | VIP პროგნოზები & ბილეთის გენერატორი</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-950 text-gray-100 font-sans pb-24">

    <!-- Header -->
    <header class="border-b border-amber-500/20 bg-gray-900/90 px-4 py-3 sticky top-0 z-50 backdrop-blur-md flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-bolt text-amber-400 text-xl"></i>
            <h1 class="text-xl font-extrabold tracking-wider text-amber-400">OLYMPUS<span class="text-white">BETS</span></h1>
        </div>
        <button class="bg-gradient-to-r from-amber-500 to-amber-600 text-gray-950 font-bold text-xs px-3 py-2 rounded-lg shadow hover:opacity-90 transition">
            <i class="fa-solid fa-user-lock mr-1"></i> ავტორიზაცია
        </button>
    </header>

    <main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Ticket Generator Widget -->
        <aside class="bg-gray-900 border border-amber-500/30 p-4 rounded-2xl h-fit shadow-xl space-y-4">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <h3 class="text-base font-bold text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> AI ბილეთის გენერატორი
                </h3>
                <span class="text-[10px] bg-amber-500/10 text-amber-400 font-semibold px-2 py-0.5 rounded border border-amber-500/20">v3.6 Low-Odds</span>
            </div>

            <!-- Multi-League Selection -->
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="text-xs text-gray-400 font-medium">აირჩიეთ ლიგები (მრავალობითი):</label>
                    <button onclick="toggleSelectAllLeagues(true)" class="text-[10px] text-amber-400 hover:underline">ყველას მონიშვნა</button>
                </div>

                <div class="bg-gray-950 border border-gray-800 rounded-xl p-3 max-h-48 overflow-y-auto space-y-2 text-xs">
                    <label class="flex items-center gap-2 text-gray-300 hover:text-amber-400 cursor-pointer">
                        <input type="checkbox" class="league-checkbox accent-amber-500 w-4 h-4" value="UEFA Champions League" checked>
                        <span>🇪🇺 ჩემპიონთა ლიგა</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-300 hover:text-amber-400 cursor-pointer">
                        <input type="checkbox" class="league-checkbox accent-amber-500 w-4 h-4" value="Premier League" checked>
                        <span>🏴󠁧󠁢󠁥󠁮󠁧󠁿 ინგლისი - პრემიერ ლიგა</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-300 hover:text-amber-400 cursor-pointer">
                        <input type="checkbox" class="league-checkbox accent-amber-500 w-4 h-4" value="Championship" checked>
                        <span>🏴󠁧󠁢󠁥󠁮󠁧󠁿 ინგლისი - ჩემპიონშიპი</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-300 hover:text-amber-400 cursor-pointer">
                        <input type="checkbox" class="league-checkbox accent-amber-500 w-4 h-4" value="La Liga" checked>
                        <span>🇪🇸 ესპანეთი - ლალიგა</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-300 hover:text-amber-400 cursor-pointer">
                        <input type="checkbox" class="league-checkbox accent-amber-500 w-4 h-4" value="La Liga 2" checked>
                        <span>🇪🇸 ესპანეთი - სეგუნდა</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-300 hover:text-amber-400 cursor-pointer">
                        <input type="checkbox" class="league-checkbox accent-amber-500 w-4 h-4" value="Serie A" checked>
                        <span>🇮🇹 იტალია - სერია A</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-300 hover:text-amber-400 cursor-pointer">
                        <input type="checkbox" class="league-checkbox accent-amber-500 w-4 h-4" value="Serie B" checked>
                        <span>🇮🇹 იტალია - სერია B</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-300 hover:text-amber-400 cursor-pointer">
                        <input type="checkbox" class="league-checkbox accent-amber-500 w-4 h-4" value="Bundesliga" checked>
                        <span>🇩🇪 გერმანია - ბუნდესლიგა</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-300 hover:text-amber-400 cursor-pointer">
                        <input type="checkbox" class="league-checkbox accent-amber-500 w-4 h-4" value="2. Bundesliga" checked>
                        <span>🇩🇪 გერმანია - 2. ბუნდესლიგა</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-300 hover:text-amber-400 cursor-pointer">
                        <input type="checkbox" class="league-checkbox accent-amber-500 w-4 h-4" value="Ligue 1" checked>
                        <span>🇫🇷 საფრანგეთი - ლიგა 1</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-300 hover:text-amber-400 cursor-pointer">
                        <input type="checkbox" class="league-checkbox accent-amber-500 w-4 h-4" value="Ligue 2" checked>
                        <span>🇫🇷 საფრანგეთი - ლიგა 2</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-300 hover:text-amber-400 cursor-pointer">
                        <input type="checkbox" class="league-checkbox accent-amber-500 w-4 h-4" value="Eredivisie" checked>
                        <span>🇳🇱 ჰოლანდია - ერედივიზი</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-300 hover:text-amber-400 cursor-pointer">
                        <input type="checkbox" class="league-checkbox accent-amber-500 w-4 h-4" value="Liga Portugal" checked>
                        <span>🇵🇹 პორტუგალია - პრიმეირა</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-300 hover:text-amber-400 cursor-pointer">
                        <input type="checkbox" class="league-checkbox accent-amber-500 w-4 h-4" value="Super Lig" checked>
                        <span>🇹🇷 თურქეთი - სუპერლიგა</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-300 hover:text-amber-400 cursor-pointer">
                        <input type="checkbox" class="league-checkbox accent-amber-500 w-4 h-4" value="Erovnuli Liga" checked>
                        <span>🇬🇪 საქართველო - ეროვნული ლიგა</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-300 hover:text-amber-400 cursor-pointer">
                        <input type="checkbox" class="league-checkbox accent-amber-500 w-4 h-4" value="NBA" checked>
                        <span>🏀 NBA</span>
                    </label>
                </div>
            </div>

            <div>
                <label class="text-xs text-gray-400 block mb-1 font-medium">სასურველი ჯამური კოეფიციენტი</label>
                <div class="relative">
                    <input id="targetOdds" type="number" value="3.5" step="0.5" min="1.2" max="500" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-amber-400 text-lg font-black outline-none focus:border-amber-400 pr-10">
                    <span class="absolute right-3 top-3.5 text-gray-500 text-xs font-bold">X</span>
                </div>
            </div>

            <div>
                <label class="text-xs text-gray-400 block mb-1 font-medium">რისკის დონე</label>
                <select id="riskLevel" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-sm text-gray-200 outline-none focus:border-amber-400 font-semibold">
                    <option value="very_low" selected>🔰 ულტრა დაბალი (1.15 - 1.40 კოეფიციენტები)</option>
                    <option value="low">🟢 დაბალი (1.40 - 1.70 კოეფიციენტები)</option>
                    <option value="medium">🟡 საშუალო (1.70 - 2.20)</option>
                    <option value="high">🔴 მაღალი (2.20+)</option>
                </select>
            </div>

            <button onclick="generateTicket()" class="w-full bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 hover:brightness-110 text-gray-950 font-extrabold py-3.5 rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2 text-sm">
                <i class="fa-solid fa-bolt"></i> ბილეთის აწყობა
            </button>

            <!-- Generated Ticket Result Container -->
            <div id="ticketResult" class="hidden border-t border-gray-800 pt-4 space-y-3">
                <div class="flex justify-between items-center bg-amber-500/10 p-3 rounded-xl border border-amber-500/30">
                    <div>
                        <span class="text-[11px] text-gray-400 font-bold block">აწყობილი კოეფიციენტი</span>
                        <span id="matchCount" class="text-[10px] text-amber-400/80">0 მატჩი</span>
                    </div>
                    <span id="totalOdds" class="text-2xl font-black text-amber-400">0.00</span>
                </div>

                <div id="ticketMatches" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>

                <button onclick="copyTicketCode()" class="w-full bg-gray-800 hover:bg-gray-700 text-amber-400 text-xs font-bold py-2.5 rounded-lg border border-amber-500/20 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-copy"></i> ბილეთის კოდის კოპირება
                </button>
            </div>
        </aside>

        <!-- Main Feeds & Custom Odds -->
        <section class="lg:col-span-2 space-y-4">
            
            <!-- Category Filters -->
            <div class="flex gap-2 overflow-x-auto pb-1 text-xs font-bold scrollbar-none">
                <button onclick="filterCategory('all')" class="bg-amber-500 text-gray-950 px-3.5 py-2 rounded-xl whitespace-nowrap shadow">ყველა</button>
                <button onclick="filterCategory('1x2')" class="bg-gray-900 border border-gray-800 text-gray-300 hover:text-amber-400 px-3.5 py-2 rounded-xl whitespace-nowrap">1X2 & გოლები</button>
                <button onclick="filterCategory('corners')" class="bg-gray-900 border border-gray-800 text-gray-300 hover:text-amber-400 px-3.5 py-2 rounded-xl whitespace-nowrap">🚩 კუთხურები</button>
                <button onclick="filterCategory('cards')" class="bg-gray-900 border border-gray-800 text-gray-300 hover:text-amber-400 px-3.5 py-2 rounded-xl whitespace-nowrap">🟨 ბარათები</button>
                <button onclick="filterCategory('specials')" class="bg-gray-900 border border-gray-800 text-gray-300 hover:text-amber-400 px-3.5 py-2 rounded-xl whitespace-nowrap">🎯 ოფსაიდი/ჰანდიკაპი</button>
            </div>

            <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-fire text-red-500"></i> დღის ტოპ მატჩები & ევროპული ლიგები
            </h2>

            <div id="matchesList" class="space-y-4"></div>
        </section>

    </main>

    <script>
        const database = [
            // Champions League
            { id: 101, league: "UEFA Champions League", match: "რეალი vs მანჩესტერ სიტი", type: "1x2", pick: "1.5-ზე მეტი გოლი", odds: 1.22, risk: "very_low" },
            { id: 102, league: "UEFA Champions League", match: "რეალი vs მანჩესტერ სიტი", type: "corners", pick: "კუთხურები 7.5-ზე მეტი", odds: 1.35, risk: "very_low" },
            { id: 1, league: "UEFA Champions League", match: "რეალი vs მანჩესტერ სიტი", type: "1x2", pick: "რეალის მოგება (1)", odds: 2.45, risk: "medium" },
            { id: 2, league: "UEFA Champions League", match: "რეალი vs მანჩესტერ სიტი", type: "corners", pick: "კუთხურები 9.5-ზე მეტი", odds: 1.85, risk: "medium" },

            // Premier League
            { id: 103, league: "Premier League", match: "არსენალი vs ჩელსი", type: "1x2", pick: "1X (არსენალის არ წაგება)", odds: 1.25, risk: "very_low" },
            { id: 104, league: "Premier League", match: "არსენალი vs ჩელსი", type: "cards", pick: "ყვითელი ბარათები 2.5-ზე მეტი", odds: 1.28, risk: "very_low" },
            { id: 6, league: "Premier League", match: "არსენალი vs ჩელსი", type: "1x2", pick: "არსენალის მოგება (1)", odds: 1.80, risk: "low" },
            { id: 105, league: "Premier League", match: "ლივერპული vs ტოტენჰემი", type: "1x2", pick: "1.5-ზე მეტი გოლი", odds: 1.18, risk: "very_low" },

            // La Liga
            { id: 106, league: "La Liga", match: "ბარსელონა vs ატლეტიკო", type: "1x2", pick: "1X (ბარსელონას არ წაგება)", odds: 1.30, risk: "very_low" },
            { id: 107, league: "La Liga", match: "ბარსელონა vs ატლეტიკო", type: "corners", pick: "კუთხურები 6.5-ზე მეტი", odds: 1.25, risk: "very_low" },

            // Serie A
            { id: 108, league: "Serie A", match: "ინტერი vs იუვენტუსი", type: "1x2", pick: "1X (ინტერის არ წაგება)", odds: 1.26, risk: "very_low" },
            { id: 109, league: "Serie A", match: "ინტერი vs იუვენტუსი", type: "cards", pick: "ყვითელი ბარათები 3.5-ზე მეტი", odds: 1.33, risk: "very_low" },

            // Bundesliga
            { id: 110, league: "Bundesliga", match: "ბაიერნი vs დორტმუნდი", type: "1x2", pick: "2.5-ზე მეტი გოლი", odds: 1.38, risk: "very_low" },
            { id: 111, league: "Bundesliga", match: "ბაიერნი vs დორტმუნდი", type: "corners", pick: "კუთხურები 8.5-ზე მეტი", odds: 1.32, risk: "very_low" },

            // Ligue 1
            { id: 112, league: "Ligue 1", match: "პსჟ vs მარსელი", type: "1x2", pick: "1X (პსჟ-ს არ წაგება)", odds: 1.16, risk: "very_low" },
            { id: 113, league: "Ligue 1", match: "პსჟ vs მარსელი", type: "1x2", pick: "1.5-ზე მეტი გოლი", odds: 1.22, risk: "very_low" },

            // Erovnuli Liga
            { id: 114, league: "Erovnuli Liga", match: "დინამო თბილისი vs ტორპედო", type: "1x2", pick: "1.5-ზე მეტი გოლი", odds: 1.35, risk: "very_low" }
        ];

        function renderMatches(items) {
            const container = document.getElementById("matchesList");
            container.innerHTML = "";

            if (items.length === 0) {
                container.innerHTML = `<div class="bg-gray-900 p-6 rounded-2xl text-center text-gray-400 text-sm">არჩეულ კატეგორიაში მატჩები არ მოიძებნა</div>`;
                return;
            }

            const grouped = {};
            items.forEach(item => {
                if (!grouped[item.match]) grouped[item.match] = { league: item.league, markets: [] };
                grouped[item.match].markets.push(item);
            });

            Object.keys(grouped).forEach(matchName => {
                const matchData = grouped[matchName];
                let marketsHTML = "";

                matchData.markets.forEach(m => {
                    let badgeColor = "bg-gray-800 text-gray-300";
                    if (m.type === "corners") badgeColor = "bg-blue-500/10 text-blue-400 border-blue-500/20";
                    if (m.type === "cards") badgeColor = "bg-yellow-500/10 text-yellow-400 border-yellow-500/20";
                    if (m.type === "specials") badgeColor = "bg-purple-500/10 text-purple-400 border-purple-500/20";

                    marketsHTML += `
                        <div class="flex justify-between items-center bg-gray-950 p-2.5 rounded-lg border border-gray-800 text-xs">
                            <span class="font-medium text-gray-300 flex items-center gap-1.5">
                                <span class="px-1.5 py-0.5 text-[9px] rounded border ${badgeColor}">${m.type.toUpperCase()}</span>
                                ${m.pick}
                            </span>
                            <span class="font-bold text-amber-400 bg-amber-500/10 px-2 py-1 rounded border border-amber-500/20">${m.odds.toFixed(2)}</span>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl shadow-md space-y-3">
                        <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                            <span class="text-[10px] text-amber-400 font-extrabold uppercase tracking-wider">${matchData.league}</span>
                            <span class="text-[10px] text-gray-400"><i class="fa-regular fa-clock"></i> დღეს</span>
                        </div>
                        <h4 class="font-extrabold text-base text-gray-100">${matchName}</h4>
                        <div class="space-y-1.5">${marketsHTML}</div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            if (cat === "all") {
                renderMatches(database);
            } else {
                const filtered = database.filter(d => d.type === cat);
                renderMatches(filtered);
            }
        }

        function toggleSelectAllLeagues(status) {
            document.querySelectorAll('.league-checkbox').forEach(cb => cb.checked = status);
        }

        function generateTicket() {
            const targetOdds = parseFloat(document.getElementById("targetOdds").value) || 3.5;
            const risk = document.getElementById("riskLevel").value;
            const selectedLeagues = Array.from(document.querySelectorAll('.league-checkbox:checked')).map(cb => cb.value);

            if (selectedLeagues.length === 0) {
                alert("გთხოვთ, მონიშნოთ სულ მცირე 1 ლიგა!");
                return;
            }

            let filteredPool = database.filter(d => selectedLeagues.includes(d.league));

            if (risk === "very_low") filteredPool = filteredPool.filter(d => d.risk === "very_low");
            else if (risk === "low") filteredPool = filteredPool.filter(d => d.risk === "low" || d.risk === "very_low");
            else if (risk === "medium") filteredPool = filteredPool.filter(d => d.risk === "medium");
            else if (risk === "high") filteredPool = filteredPool.filter(d => d.risk === "high");

            if (filteredPool.length === 0) {
                alert("არჩეულ ფილტრებში არ არის საკმარისი თამაშები!");
                return;
            }

            const shuffled = [...filteredPool].sort(() => 0.5 - Math.random());
            
            let currentOdds = 1.0;
            let selectedItems = [];
            let usedMatches = new Set();

            for (let item of shuffled) {
                if (currentOdds >= targetOdds) break;
                if (!usedMatches.has(item.match)) {
                    selectedItems.push(item);
                    currentOdds *= item.odds;
                    usedMatches.add(item.match);
                }
            }

            const resultDiv = document.getElementById("ticketResult");
            const matchesDiv = document.getElementById("ticketMatches");
            const totalOddsSpan = document.getElementById("totalOdds");
            const matchCountSpan = document.getElementById("matchCount");

            matchesDiv.innerHTML = "";
            selectedItems.forEach(item => {
                matchesDiv.innerHTML += `
                    <div class="bg-gray-950 p-2.5 rounded-xl border border-gray-800 space-y-1">
                        <div class="text-[10px] text-gray-400 font-semibold">${item.league} • ${item.match}</div>
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-amber-400 font-bold">${item.pick}</span>
                            <span class="bg-amber-500/10 text-amber-400 px-1.5 py-0.5 rounded font-black text-[11px] border border-amber-500/20">${item.odds.toFixed(2)}</span>
                        </div>
                    </div>
                `;
            });

            totalOddsSpan.innerText = currentOdds.toFixed(2);
            matchCountSpan.innerText = `${selectedItems.length} მატჩი ბილეთში`;
            resultDiv.classList.remove("hidden");
        }

        function copyTicketCode() {
            const randomCode = "OLY-" + Math.floor(100000 + Math.random() * 900000);
            navigator.clipboard.writeText(randomCode);
            alert("ბილეთის კოდი კოპირებულია: " + randomCode);
        }

        renderMatches(database);
    </script>
</body>
</html>
